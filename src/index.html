<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://localhost:5000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://localhost:5000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'"
    />
    <title>StreakBuddy</title>
    <style>
      @font-face {
        font-family: "geomanist";
        src: url("./geom.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      html,body{
        height: 100%;
        margin:0;
      }
        body{
          display: flex;
          flex-direction: column;
            width: 100%;
            height:100%;
            margin:0;
            padding: 0;
            font-family:'geomanist';
        }
        span{
            font-family:"geomanist";
        }
        .status{
          display:flex;
          justify-content: space-between;
          flex-shrink: 0;
          padding:0.2em 0.4em;
          font-size: 1.3em;
          color:#ffffff;
          
        }
        .left{
          justify-content:left;
        }
        .right{
          justify-self: right;
        }
        .main{
          padding:0.2em;
          box-sizing: border-box;
          flex:1;
          min-height: 0;
          width: 100%;
          background-color: #B1EAFF;
        }
        h1,h2,h3,h4,h5{
          margin: 0;
          padding: 0;
          line-height: 1;
        }
        h1{
          font-size: 3em;
        }
        .itemic{
          justify-content: center;
          align-items: center;
        }
        .itemic img{
          width: 15em;
          height: 15em;
        }
        .itemo{
          display: flex;
          align-items: center;
          justify-content: center;
          position: absolute;
          right:1em;
          bottom:1em;
          width: 4em;
          height: 4em;
          box-sizing: border-box;
          border-radius: 50%;
          background-color: #00AAF1;
          text-decoration: none;
          overflow: hidden;
        }
        .itemo img{
          width: 3.5em;
          height: 3.5em;
        }
        .placeh{
          width:100%;
          display: flex;
          justify-content: space-between;
          flex-shrink: 0;
          padding:0.2em 0.4em;
          box-sizing: border-box;
        }
        .loadhold{
          width: 100%;
          background-color: #ffffff;
          border-radius: 2em;
          height: 1em;
          padding: 0.2em;
          box-sizing: border-box;
        }
        .load{
          background-color: #00AAF1;
          width: auto ;
          height: 100%;
          border-radius: 2em;
        }
    </style>
  </head>
  <body>
    <div class="status">
        <span id="time" class="left">00:00am</span>
        <span id="date" class="right">00th January 0000</span>
    </div>
    <div class="main">
      <h1 id="stage">Stage 0</h1>
      <span id="stagetec">Unhatched Seed</span>
      <div class="loadhold">
        <div id="load" class="load"></div>
      </div>
      <div class="placeh">
        <span id="current" class="lef">0.0 hrs</span>
        <span id="final" class="rig">1 hrs</span>
      </div>
      <div class="itemic">
        <img src="art/1.png">
      </div>
      <a class="itemo" href="setting.html">
        <img src="setting.svg">
      </a>
    </div>
    <script>
      var times = document.getElementById('time');
      var date = document.getElementById('date');

      function time(){
        var current = new Date();
        var minutes = current.getMinutes();
        var hours = current.getHours();
        var suffix = hours >= 12 ? "pm" : "am";

        hours = hours % 12 || 12;
        times.textContent = ("0" + hours).substr(-2) + ":" + ("0" + minutes).substr(-2) + suffix;
      }
      function dat(){
        var currentDate = new Date();
        var months = ['January', 'February', 'March', 'April', 'May', 'June', "July", 'August', 'September', 'October', 'November', 'December'];
        date.textContent = currentDate.getDate() + " " + months[currentDate.getMonth()] + " " + currentDate.getFullYear();
      }
      dat()
      time();
      setInterval(time, 1000);

      function updateProgBar(current, final){
        var load = document.getElementById('load');
        var percentage = (current / final)*100;
        if (final <= 0) {
          load.style.width = '0%';
          return;
        }
        load.style.width = Math.min(percentage, 100) + "%";
      }
      function updateStage(stage, stagetec){
        var stageel = document.getElementById('stage');
        var stagetecel = document.getElementById('stagetec');
        stageel.textContent = "Stage " + stage;
        stagetecel.textContent = stagetec;
      }
      function updateSummary(currentHours, label){
        var currentel = document.getElementById('current');
        var finalel = document.getElementById('final');
        currentel.textContent = Number(currentHours || 0).toFixed(1) + ' hrs';
        finalel.textContent = label || 'Last 7 Days';
      }
      function retriveHackandUp(){
        fetch('http://localhost:5000/hackdata')
        .then(response => {
          if (!response.ok) {
            throw new Error(`Hackatime request failed: ${response.status}`)
          }
          return response.json()
        })
        .then(data => {
          const stages = {
            0: "Unhatched Seed",
            1: "Sprouting Seed",
            2: "Overly Excited Seedling",
            3: "Budding Plant",
            4: "Crackling Seed",
            5: "Sprouts",
            6: "Young Plant",
            7: "Budding Flower",
            8: "Blooming Flower",
            9: "Full Bloom",
          }
          const imgs = {
            0: "art/1.png",
            1: "art/2.png",
            2: "art/3.png",
            3: "art/4.png",
            4: "art/5.png",
            5: "art/6.png",
            6: "art/7.png",
            7: "art/8.png",
            8: "art/9.png",
            9: "art/10.png",
          }
          const finalhr = [0.5, 1, 1.6, 2.5, 3.8, 5.5, 7, 8, 10]
          const stage = Number(data.stage ?? 0)
          const weeklyHours = Number(data.current || 0)
          const stageGoal = Number(finalhr[stage] ?? 0.5)
          updateStage(stage, stages[stage] || "Unhatched Seed")
          updateSummary(weeklyHours, 'Last 7 Days')
          updateProgBar(weeklyHours, Math.max(stageGoal, weeklyHours > 0 ? weeklyHours : 0.5))
          document.querySelector('.itemic img').src = imgs[stage] || imgs[0]
        })
        .catch(error => {
          console.error('Failed to load Hackatime data:', error)
        })
      }

      retriveHackandUp();
      window.addEventListener('focus', retriveHackandUp);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          retriveHackandUp();
        }
      });
    </script>
  </body>
</html>
